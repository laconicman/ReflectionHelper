name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two platforms because the package claims to be Foundation-only: macOS is
  # where it is used, Linux is what proves the claim.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test
